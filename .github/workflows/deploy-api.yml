name: Deploy API

# main deploys to production, staging to staging. Each branch only reaches its own GitHub environment,
# which holds that target's Lightsail host, SSH key, and Supabase project.
on:
  push:
    branches: [main, staging]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".node-version"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/ci.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    uses: ./.github/workflows/ci.yml

  # Migrations land before the new API starts, so the API never runs against a schema it predates.
  migrate:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Connects straight to Postgres through the session pooler (runners have no IPv6 for the direct host),
      # so no Supabase access token is needed. Same CLI version the database CI job replays migrations with.
      - name: Push migrations
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
        run: |
          password=$(jq -rn --arg p "$DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          npx --yes supabase@2.105.0 db push --yes \
            --db-url "postgresql://postgres.$PROJECT_REF:$password@$POOLER_HOST:5432/postgres"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull, build, and restart
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/lightsail -o IdentitiesOnly=yes "ubuntu@$HOST" "bash -s" -- "$SHA" "$BRANCH" <<'EOF'
          set -euo pipefail
          sha="$1"
          branch="$2"
          repo=/srv/budgie/Odin

          echo "==> Pull"
          sudo -u budgie git -C "$repo" fetch --prune origin "$branch"
          sudo -u budgie git -C "$repo" merge --ff-only "$sha"

          echo "==> Build"
          # --noEmitOnError keeps the running dist/ intact if the build fails.
          # odin-api runs ~/.nvm/current/bin/node, so repoint it at the .nvmrc version.
          sudo -iu budgie bash -s -- "$repo" <<'BUILD'
          set -eo pipefail
          source ~/.nvm/nvm.sh
          cd "$1"
          nvm install
          nvm alias default "$(cat .nvmrc)"
          ln -sfn "$(dirname "$(dirname "$(nvm which "$(cat .nvmrc)")")")" ~/.nvm/current
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm --filter api exec tsc -p tsconfig.json --noEmitOnError
          BUILD

          echo "==> Restart"
          sudo systemctl restart odin-api

          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3001/health; then
              echo
              echo "Deployed $(sudo -u budgie git -C "$repo" log -1 --oneline)"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed" >&2
          sudo systemctl status odin-api --no-pager || true
          sudo tail -n 50 /var/log/budgie/api.log || true
          exit 1
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/lightsail
